name: Nightly Build

on:
  schedule:
    # Runs automatically every day at midnight UTC (00:00 UTC)
    - cron: '0 0 * * *'
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-melonloader:
    name: Build Nightly (MelonLoader)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Calculate & Stamp Nightly Build Number
        id: version
        shell: pwsh
        run: |
          $infoPath = "Magnetar Client/src/Config/MagnetarInfo.cs"
          $content = Get-Content $infoPath -Raw

          # Extract Version (e.g., "4.0.3")
          if ($content -match 'public const string Version = "(?<ver>[^"]+)";') {
              $ver = $Matches['ver']
          } else {
              $ver = "4.0.3"
          }

          # Nightly build number is GitHub Actions run number (1, 2, 3...)
          $buildNum = "${{ github.run_number }}"

          Write-Host "Version:      $ver"
          Write-Host "Build Number: $buildNum"

          # Stamp internal BuildNumber constant in MagnetarInfo.cs before compilation
          $content = $content -replace 'public const int BuildNumber = \d+;', "public const int BuildNumber = $buildNum;"
          Set-Content -Path $infoPath -Value $content

          # Export outputs
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "build_number=$buildNum" >> $env:GITHUB_OUTPUT

      - name: Restore NuGet dependencies
        run: dotnet restore "Magnetar Client/Magnetar Client.csproj"

      - name: Compile Mod (Nightly_Melon)
        run: >
          dotnet build "Magnetar Client/Magnetar Client.csproj"
          --configuration Nightly_Melon
          --no-restore
          -p:GenerateAssemblyInfo=false

      - name: Assemble Release Package
        shell: pwsh
        run: |
          $outMods = "nightly-staging/Mods"
          $outData = "$outMods/Magnetar Data"

          # Create directory structure
          New-Item -ItemType Directory -Force -Path "$outData/Resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "$outData/Themes"    | Out-Null

          # Copy compiled mod DLL
          Copy-Item "Magnetar Client/bin/Melonloader/Nightly_Melon/Magnetar Client.dll" $outMods -Force

          # Copy Magnetar Data (resources, themes, data definitions)
          # Note: Magnetar Translation is excluded intentionally
          Copy-Item "Magnetar Data/Resources/*"     "$outData/Resources" -Recurse -Force
          Copy-Item "Magnetar Data/Themes/*"        "$outData/Themes"    -Recurse -Force
          Copy-Item "Magnetar Data/FxData.json"     $outData -Force
          Copy-Item "Magnetar Data/TextureData.json" $outData -Force

          Write-Host "Package assembled successfully in $outMods"

          # Compress to zip for public release asset download
          Compress-Archive -Path "nightly-staging/Mods" -DestinationPath "MagnetarClient-MelonLoader.zip" -Force

          # Create version text file for fast unauthenticated build checks
          Set-Content -Path "nightly-build.txt" -Value "${{ steps.version.outputs.build_number }}"

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Magnetar Client Nightly (Build ${{ steps.version.outputs.build_number }})"
          body: |
            Automated nightly build for **Magnetar Client v${{ steps.version.outputs.version }}**.
            - **Version**: `${{ steps.version.outputs.version }}`
            - **Build Number**: `${{ steps.version.outputs.build_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
          prerelease: true
          make_latest: false
          files: |
            MagnetarClient-MelonLoader.zip
            nightly-build.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetarClient-v${{ steps.version.outputs.version }}-Build${{ steps.version.outputs.build_number }}-MelonLoader
          path: nightly-staging/
          if-no-files-found: error
          retention-days: 14

      - name: Add Job Summary
        if: always()
        shell: pwsh
        run: |
          $summary = @"
          ## Nightly Build Summary
          | Key | Value |
          | :--- | :--- |
          | **Version** | `${{ steps.version.outputs.version }}` |
          | **Build Number** | `${{ steps.version.outputs.build_number }}` |
          | **Target** | MelonLoader (PC) |
          | **Configuration** | `Nightly_Melon` |
          | **Branch** | `${{ github.ref_name }}` |
          | **Commit** | `${{ github.sha }}` |
          | **Release Tag** | `nightly` |
          "@
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
