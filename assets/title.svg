<svg fill="none" viewBox="0 0 600 100" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        .smooth-gradient {
          background: linear-gradient(to right, #ff1c8e, #ff4a2e, #ff0000, #ff1573);
          background-size: 200% auto;
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          font-size: 60px;
          font-weight: bold;
          display: inline-block;
          animation: smoothMove 6s linear infinite;
        }
        @keyframes smoothMove {
          0% { background-position: 0% center; }
          100% { background-position: -200% center; }
        }
      </style>
      <div class="smooth-gradient">Magnetar Client</div>
    </div>
  </foreignObject>
</svg>
